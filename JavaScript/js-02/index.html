<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Менеджер задач</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="app">
        <header class="header">
            <p class="subtitle">МОИ ЗАДАЧИ</p>
            <h1>Менеджер задач</h1>
            <p class="description">Планируй дела и отмечай выполненное.</p>
        </header>

        <section class="panel">
            <form id="task-form">
                <label for="task-title">Новая задача</label>
                <div class="form-row">
                    <input id="task-title" name="title" type="text" minlength="3" maxlength="80" placeholder="Например, подготовить отчёт" required>
                    <button type="submit" class="add-button">Добавить</button>
                </div>
                <p id="title-error" class="field-error" aria-live="polite"></p>
            </form>
        </section>

        <section class="tasks-section">
            <div class="tasks-heading">
                <div>
                    <h2>Список задач</h2>
                    <p id="task-count">Всего задач: 0</p>
                    <p id="active-count">Активных: 0</p>
                </div>
                <label class="filter-label" for="task-filter">
                    Показать
                    <select id="task-filter">
                        <option value="all">Все задачи</option>
                        <option value="active">Активные</option>
                        <option value="completed">Выполненные</option>
                    </select>
                </label>
            </div>
            <ul id="task-list" class="task-list"></ul>
            <button id="clear-completed" class="clear-button" type="button">Очистить выполненные</button>
        </section>
    </main>
</body>
</html>
